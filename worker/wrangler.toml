name = "tru-pulse-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve on our own domain. Required before cookie auth: a cookie for truhq.co is
# never sent to workers.dev, so the app and the API must be the same site. Also
# stops leaking the Cloudflare account name in every request. The workers.dev
# address keeps working, so existing FUB webhooks are unaffected until they are
# deliberately re-registered (worker/ops/register-webhooks.sh).
# workers_dev MUST stay true. Adding `routes` disables the workers.dev address by
# default, and all four teams' FUB webhooks are registered against it — turning it
# off took live updates down for every team until this was restored. Both addresses
# serve the same Worker; the old one retires only after the hooks are re-registered
# onto api.truhq.co via worker/ops/register-webhooks.sh.
workers_dev = true
preview_urls = true
routes = [
  { pattern = "api.truhq.co", custom_domain = true }
]


# Incremental sync every 30 min; daily 3-strike reconcile at 07:05;
# weekly Leadership Brief Monday 13:00 UTC (~8-9am ET).
[triggers]
# The */12 tick drives the morning brief. Minutes 12/24/36/48 are chosen so it
# never collides with the other three crons: two expressions matching the same
# minute make Cloudflare fire scheduled() twice, and the handler would run a
# full multi-tenant sync alongside the tick.
crons = ["*/30 * * * *", "5 7 * * *", "0 13 * * 1", "12,24,36,48 * * * *"]

# Secrets (set with `wrangler secret put <NAME>`), never committed:
#   SUPABASE_URL                 https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service-role key (bypasses RLS — server-side only)
#   FUB_ENC_KEY                  base64 of a 32-byte AES-GCM key (encrypts tenant FUB keys)
#   ADMIN_TOKEN                  guards /provision + manual /sync
#   COACH_INGEST_TOKEN           guards POST /coach/weekly-report (Hermes laptop sends)
#   ZILLOW_TARGETS_INGEST_TOKEN  guards POST /zillow/targets (fub-weekly-reports scraper sends)
#   FUB_SYSTEM_KEY               FUB system key (X-System-Key) — REQUIRED to register webhooks
#   FUB_SYSTEM_NAME              FUB system name (X-System) — set to 'TruPulse' so Pulse's
#                                webhooks don't collide with the Terrason dashboard's system.
#                                Falls back to 'TerrasonFUBDashboard' when unset (the old collision).
#   WEBHOOK_SECRET               appended to the callback URL as ?key= to authenticate FUB→worker
#   RESEND_API_KEY               Resend key (weekly brief + leader invites)
#   BRIEF_FROM                   weekly Leadership Brief sender — must be @truhq.co
#   INVITE_FROM                  leader invite sender, e.g. "TRU HQ <hq@truhq.co>"
#   INFISICAL_CLIENT_ID          Infisical Universal Auth machine identity (same one
#   INFISICAL_CLIENT_SECRET      TRU OS's worker uses) — the Stripe key is read from
#   INFISICAL_PROJECT_ID         the vault at /Stripe, so it never lives here directly.
#   STRIPE_SECRET_KEY            fallback only, for local runs; normally unset.
#   MONEY_FROM                   broker verification + invoice-copy sender, e.g.
#                                "Terrason Consulting <billing@truhq.co>" — must be
#                                @truhq.co. Falls back to BRIEF_FROM when unset.
#                                truhq.co is the ONLY domain verified in Resend; any
#                                other sender domain is rejected SILENTLY.

# Server-side login sessions (Phase 3 of the cookie-auth migration). The browser only
# ever holds an opaque session id in an httpOnly cookie; the Supabase access and
# refresh tokens live here, where no script can reach them. KV rather than an
# encrypted cookie so a session can be REVOKED — offboard an agent and their access
# ends immediately, which matters at hundreds of agents across seven teams.
[[kv_namespaces]]
binding = "SESSIONS"
id = "d491e3cf16db4de8bd10addcab4d1a3f"

# One-time contract approval tokens (send/void). One Durable Object per actor;
# a token is scoped to one action + envelope + version, spends once inside a
# storage transaction, and dies after five minutes. Ported from TRU OS -
# without this binding the Contracts tab's SEND and VOID stay locked.
[durable_objects]
bindings = [
  { name = "CONTRACT_APPROVALS", class_name = "ContractApprovalLedger" },
]

[[migrations]]
tag = "v1-contract-approvals"
new_sqlite_classes = ["ContractApprovalLedger"]
