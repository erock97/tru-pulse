name = "tru-pulse-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve on our own domain. Required before cookie auth: a cookie for truhq.co is
# never sent to workers.dev, so the app and the API must be the same site. Also
# stops leaking the Cloudflare account name in every request. The workers.dev
# address keeps working, so existing FUB webhooks are unaffected until they are
# deliberately re-registered (worker/ops/register-webhooks.sh).
# workers_dev MUST stay true. Adding `routes` disables the workers.dev address by
# default, and all four teams' FUB webhooks are registered against it — turning it
# off took live updates down for every team until this was restored. Both addresses
# serve the same Worker; the old one retires only after the hooks are re-registered
# onto api.truhq.co via worker/ops/register-webhooks.sh.
workers_dev = true
preview_urls = true
routes = [
  { pattern = "api.truhq.co", custom_domain = true }
]


# Incremental sync every 30 min; daily 3-strike reconcile at 07:05;
# weekly Leadership Brief Monday 13:00 UTC (~8-9am ET).
[triggers]
crons = ["*/30 * * * *", "5 7 * * *", "0 13 * * 1"]

# Secrets (set with `wrangler secret put <NAME>`), never committed:
#   SUPABASE_URL                 https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service-role key (bypasses RLS — server-side only)
#   FUB_ENC_KEY                  base64 of a 32-byte AES-GCM key (encrypts tenant FUB keys)
#   ADMIN_TOKEN                  guards /provision + manual /sync
#   FUB_SYSTEM_KEY               FUB system key (X-System-Key) — REQUIRED to register webhooks
#   FUB_SYSTEM_NAME              FUB system name (X-System) — set to 'TruPulse' so Pulse's
#                                webhooks don't collide with the Terrason dashboard's system.
#                                Falls back to 'TerrasonFUBDashboard' when unset (the old collision).
#   WEBHOOK_SECRET               appended to the callback URL as ?key= to authenticate FUB→worker
#   RESEND_API_KEY               Resend key (weekly brief + leader invites)
#   BRIEF_FROM                   weekly Leadership Brief sender — must be @truhq.co
#   INVITE_FROM                  leader invite sender, e.g. "TRU HQ <hq@truhq.co>"
#                                truhq.co is the ONLY domain verified in Resend; any
#                                other sender domain is rejected SILENTLY.
